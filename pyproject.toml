[project]
name = "spellwarden"
version = "1.7.0"
description = "Spellwarden: the scan engine for agent skills, MCP servers and Claude Code configuration and A2A agent cards (spellwarden_scan, pure code, no I/O) and the spellwarden command that does the I/O (spellwarden_cli)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Spellwarden" }]
keywords = ["mcp", "agent-skills", "a2a", "agent-card", "security", "scanner"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0", "cryptography>=45.0.0"]

[project.scripts]
spellwarden = "spellwarden_cli.main:main"

[project.urls]
Homepage = "https://spellwarden.ai"
Source = "https://github.com/spellwarden-ai/spellwarden"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    # the reference OTLP decoder of tests/otel (runtime traces spec 4.9); never imported by the package (tests/test_pure.py)
    "opentelemetry-proto==1.45.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spellwarden_scan", "src/spellwarden_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/spellwarden_scan", "src/spellwarden_cli", "tests", "fixtures", "schemas", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: a timing test (runtime traces spec 4.9); `make check` and CI run it, with SPELLWARDEN_SPEED_FACTOR in CI"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The Zuplo guard and its check script are TypeScript and JavaScript held as text (Zuplo export spec 4.4, 4.5).
"src/spellwarden_scan/exports/zuplo_guard.py" = ["E501"]
# Moved and ported from the hosted backend verbatim (spec 6.8): its line length and its scripted test doubles stay.
"src/spellwarden_cli/net.py" = ["E501"]
"src/spellwarden_cli/probe.py" = ["E501"]
"tests/cli/test_fetcher.py" = ["ARG"]
"src/spellwarden_scan/rules/*" = ["E501"]  # the pattern tables read better on one line each
