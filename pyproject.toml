[project]
name = "spellwarden"
version = "0.2.0"
description = "The Spellwarden scan engine: baseline rules for agent skills and MCP servers, probe classification, migration checklist and curation score. Pure code, no I/O."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Spellwarden" }]
keywords = ["mcp", "agent-skills", "security", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://spellwarden.ai"
Source = "https://github.com/spellwarden-ai/spellwarden"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spellwarden_scan"]

[tool.hatch.build.targets.sdist]
include = ["src/spellwarden_scan", "tests", "fixtures", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/spellwarden_scan/rules/*" = ["E501"]  # the pattern tables read better on one line each
