# Spellwarden for the pre-commit framework: https://spellwarden.ai/docs/pre-commit?utm_source=github&utm_medium=readme&utm_campaign=pre-commit
# Written by scripts/write_hooks_yaml.py from spellwarden_cli.discover.AGENT_CONTENT_REGEX. Do not edit by hand.
- id: spellwarden
  name: Spellwarden (scan agent skills, MCP configuration and hooks)
  description: Scans the repository's agent content when it changes.
  entry: spellwarden scan --staged
  language: python
  pass_filenames: false
  require_serial: true
  files: '(?i)(^|/)(skill\.md|(skills|\.claude|\.cursor|\.codex|\.gemini|\.devin|\.windsurf|\.agents|\.vscode|\.claude-plugin|\.spellwarden|\.well-known)/.+|\.github/(hooks|instructions|agents|copilot)/.+|\.mcp\.json|mcp\.json|claude_desktop_config\.json|hooks/hooks\.json|agents\.md|claude\.md|gemini\.md|claude\.local\.md|agents\.(override|local)\.md|agent\.md|\.github/copilot-instructions\.md|\.cursorrules|\.windsurfrules|agent-card\.json)$'
  stages: [pre-commit, pre-push, manual]
  minimum_pre_commit_version: "3.2.0"
