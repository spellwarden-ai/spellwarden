blank_issues_enabled: false
contact_links:
  - name: A working way past a rule, or a security problem
    url: https://github.com/spellwarden-ai/spellwarden/security/advisories/new
    about: Do not open a public issue. Report it privately here. You may send the same report to security@spellwarden.ai, as the security policy says. You get a first answer within five working days.
  - name: Questions and edge cases that are not a bug
    url: https://github.com/spellwarden-ai/spellwarden/discussions
    about: Ask here when you are not sure it is a miss or a false alarm, or to talk about how a rule should treat a case.
  - name: The hosted product at spellwarden.ai
    url: https://spellwarden.ai/docs?utm_source=github&utm_medium=issue-form&utm_campaign=issue-forms
    about: Questions about the dashboard, the API or billing go to the contact address on the site, not here.
