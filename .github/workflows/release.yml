name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.hashes.outputs.version }}
      wheel_sha256: ${{ steps.hashes.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.hashes.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.13"
      - name: The tag must equal v<version> of pyproject.toml
        run: |
          version="$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: make check
      - id: hashes
        name: Record the hashes of the files every later job uses
        run: |
          set -euo pipefail
          wheel="dist/spellwarden-${VERSION}-py3-none-any.whl"
          sdist="dist/spellwarden-${VERSION}.tar.gz"
          {
            echo "version=${VERSION}"
            echo "wheel_sha256=$(sha256sum "$wheel" | cut -d' ' -f1)"
            echo "sdist_sha256=$(sha256sum "$sdist" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: |
            dist/spellwarden-*.whl
            dist/spellwarden-*.tar.gz

  e2e:
    # Spec 7.4: the Action candidate, checked out at wrappers/scan-action.ref, against this run's wheel, offline,
    # over Task 17's fixture cases with Task 17's tools.
    name: e2e ${{ matrix.case }} on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        case: [clean, findings, baselined, stale-lock, broken-config, path-with-spaces, hostile-names, bad-input,
               bad-requirements, exec-bit, subdir, probe, "probe@config-key"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/e2e-setup
      - name: Build the fixture repository
        id: case
        env:
          CASE: ${{ matrix.case }}
        run: python fixtures/repos/make_repo.py "$CASE" "$RUNNER_TEMP/fx" --github-output
      - id: scan
        uses: ./.spellwarden-action
        continue-on-error: true
        with:
          path: ${{ steps.case.outputs.path }}
          fail-on: ${{ steps.case.outputs.fail-on }}
          locked: ${{ steps.case.outputs.locked }}
          probe: ${{ steps.case.outputs.probe }}
          probe-private: ${{ steps.case.outputs.probe-private }}
          comment: "false"
          sarif-upload: "false"
          telemetry: "false"
          requirements-file: ${{ steps.case.outputs.requirements-file || steps.setup.outputs.requirements-file }}
      - name: Check the result
        if: always()
        env:
          CASE: ${{ matrix.case }}
          SW_OUT_EXIT: ${{ steps.scan.outputs.exit-code }}
          SW_OUT_FINDINGS: ${{ steps.scan.outputs.findings }}
          SW_OUT_SARIF: ${{ steps.scan.outputs.sarif-file }}
          SW_OUT_OUTCOME: ${{ steps.scan.outcome }}
          SW_FIXTURE_REPO: ${{ runner.temp }}/fx
        run: python fixtures/repos/check.py "$CASE" "$RUNNER_TEMP/spellwarden.json" "$SW_OUT_EXIT" env
      - name: The SARIF file validates against the full SARIF 2.1.0 schema
        if: always() && steps.scan.outputs.sarif-file != ''
        env:
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: uv run --locked python scripts/e2e.py sarif "$SARIF"

  e2e-no-python:
    # Spec 7.4 `no-python`, with Task 17's PATH filter: every directory of PATH linked in except Python's names. No
    # setup-python or setup-uv runs here: the directories they add to $GITHUB_PATH are put in front of every later
    # step's PATH, a step's own `env: PATH` included, so the Action would find their Python. It needs no install:
    # without Python it stops before the requirements are read. The fixture scripts use the runner's python3.
    name: e2e no-python on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: ref
        run: |
          ref="$(tr -d '[:space:]' < wrappers/scan-action.ref)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::wrappers/scan-action.ref must hold one 40-hex commit"
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: spellwarden-ai/scan
          ref: ${{ steps.ref.outputs.sha }}
          path: .spellwarden-action
          persist-credentials: false
      - name: Build the fixture repository
        id: case
        run: python3 fixtures/repos/make_repo.py no-python "$RUNNER_TEMP/fx" --github-output
      - name: Build a PATH without Python
        id: nopy
        run: |
          nopy="$RUNNER_TEMP/nopy"
          mkdir -p "$nopy"
          IFS=: read -r -a dirs <<< "$PATH"
          for dir in "${dirs[@]}"; do
            if [ ! -d "$dir" ]; then continue; fi
            for tool in "$dir"/*; do
              name="${tool##*/}"
              case "$name" in python*|py|pip*|pydoc*|idle*) continue ;; esac
              if [ -x "$tool" ] && [ ! -e "$nopy/$name" ]; then ln -s "$tool" "$nopy/$name"; fi
            done
          done
          echo "dir=$nopy" >> "$GITHUB_OUTPUT"
      - name: Run the Action without Python
        id: scan
        continue-on-error: true
        uses: ./.spellwarden-action
        env:
          PATH: ${{ steps.nopy.outputs.dir }}
        with:
          path: ${{ steps.case.outputs.path }}
          comment: "false"
          sarif-upload: "false"
          telemetry: "false"
      - name: Check the result
        if: always()
        env:
          SW_OUT_EXIT: ${{ steps.scan.outputs.exit-code }}
          SW_OUT_FINDINGS: ${{ steps.scan.outputs.findings }}
          SW_OUT_SARIF: ${{ steps.scan.outputs.sarif-file }}
          SW_OUT_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 fixtures/repos/check.py no-python "$RUNNER_TEMP/spellwarden.json" "$SW_OUT_EXIT" env

  e2e-permissions:
    # Spec 7.4: the SARIF upload is refused (warning sarif_upload_failed) and the comment is refused (notice
    # comment_permission); the job result is the scan's exit code alone. The Action gets an invalid token, so the
    # upload is refused for certain: GitHub may accept a SARIF upload from a public repository's read-only token.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/e2e-setup
      - name: Build the fixture repository
        id: case
        run: python fixtures/repos/make_repo.py permissions "$RUNNER_TEMP/fx" --github-output
      - id: scan
        uses: ./.spellwarden-action
        continue-on-error: true
        with:
          path: ${{ steps.case.outputs.path }}
          fail-on: ${{ steps.case.outputs.fail-on }}
          comment: "true"
          sarif-upload: "true"
          telemetry: "false"
          token: not-a-token
          requirements-file: ${{ steps.setup.outputs.requirements-file }}
      - name: The result is the scan's, not the upload's
        if: always()
        env:
          SW_OUT_EXIT: ${{ steps.scan.outputs.exit-code }}
          SW_OUT_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          expected="$(python scripts/e2e.py expected-exit permissions)"
          test "$SW_OUT_EXIT" = "$expected" || { echo "exit-code $SW_OUT_EXIT, expected $expected"; exit 1; }
          if [ "$expected" = 0 ]; then want=success; else want=failure; fi
          test "$SW_OUT_OUTCOME" = "$want" || { echo "outcome $SW_OUT_OUTCOME, expected $want"; exit 1; }
      - name: The failed SARIF upload is a warning the Action logged
        # Spec 7.4: the Action appends the code to this file (a tag push has no pull request, so no comment code).
        if: always()
        run: grep -qx sarif_upload_failed "$RUNNER_TEMP/spellwarden-annotations.txt" || { echo "the Action did not log the sarif_upload_failed warning"; exit 1; }
      - name: A comment with a read-only token is a notice, never a failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SW_EVENT_FILE: ${{ runner.temp }}/event.json
        run: |
          set -euo pipefail
          python scripts/e2e.py event "$SW_EVENT_FILE" --repository "$GITHUB_REPOSITORY"
          venv_py="$RUNNER_TEMP/spellwarden-venv/bin/python"
          set +e
          # A step's env cannot replace the runner's own GITHUB_* values; the command's environment can.
          env GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$SW_EVENT_FILE" \
            "$venv_py" -I -m spellwarden_cli ci comment --provider github --body "$RUNNER_TEMP/spellwarden.md" \
            > "$RUNNER_TEMP/comment.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/comment.log"
          test "$code" = 0
          grep -q comment_permission "$RUNNER_TEMP/comment.log"

  e2e-telemetry:
    # Spec 7.4 and D25: telemetry on, the ping redirected to Task 17's loopback listener; check.py asserts the body.
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/e2e-setup
      - name: Start the loopback ping listener
        run: |
          python fixtures/repos/ping_listener.py 8765 "$RUNNER_TEMP/ping.json" &
          for _ in $(seq 50); do
            if [ -f "$RUNNER_TEMP/ping.json.ready" ]; then break; fi
            sleep 0.2
          done
          test -f "$RUNNER_TEMP/ping.json.ready"
      - name: Build the fixture repository (writes SPELLWARDEN_PING_URL to GITHUB_ENV)
        id: case
        run: python fixtures/repos/make_repo.py telemetry "$RUNNER_TEMP/fx" --github-output
      - id: scan
        uses: ./.spellwarden-action
        continue-on-error: true
        with:
          path: ${{ steps.case.outputs.path }}
          comment: "false"
          sarif-upload: "false"
          telemetry: ${{ steps.case.outputs.telemetry }}
          requirements-file: ${{ steps.setup.outputs.requirements-file }}
      - name: Check the result and the ping body
        if: always()
        env:
          SW_OUT_EXIT: ${{ steps.scan.outputs.exit-code }}
          SW_OUT_FINDINGS: ${{ steps.scan.outputs.findings }}
          SW_OUT_SARIF: ${{ steps.scan.outputs.sarif-file }}
          SW_OUT_OUTCOME: ${{ steps.scan.outcome }}
          SW_PING_FILE: ${{ runner.temp }}/ping.json
        run: python fixtures/repos/check.py telemetry "$RUNNER_TEMP/spellwarden.json" "$SW_OUT_EXIT" env

  publish:
    needs: [build, e2e, e2e-no-python, e2e-permissions, e2e-telemetry]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: dist holds exactly the two files the build job hashed
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "spellwarden-${VERSION}-py3-none-any.whl spellwarden-${VERSION}.tar.gz "
          printf '%s  %s\n' "$WHEEL_SHA256" "dist/spellwarden-${VERSION}-py3-none-any.whl" \
            "$SDIST_SHA256" "dist/spellwarden-${VERSION}.tar.gz" | sha256sum -c -
      # Every action is pinned by commit SHA (this job can mint the PyPI token); here the head of `release/v1` on 2026-10-19.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
          attestations: true

  image:
    needs: [build, e2e, e2e-no-python, e2e-permissions, e2e-telemetry]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      IMAGE: ghcr.io/spellwarden-ai/spellwarden
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: The wheel is the one the build job hashed
        run: echo "${WHEEL_SHA256}  dist/spellwarden-${VERSION}-py3-none-any.whl" | sha256sum -c -
      - name: Hash-checked PyYAML wheelhouse for both platforms
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            python3 -m pip download --only-binary :all: --require-hashes --no-deps \
              --platform "manylinux_2_17_${arch}" --platform "manylinux2014_${arch}" \
              --python-version 3.13 --implementation cp --abi cp313 \
              -r docker/requirements.deps.txt -d wheelhouse
          done
      - id: tags
        run: |
          {
            echo "list<<TAGS"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${VERSION%.*}"
            echo "${IMAGE}:${VERSION%%.*}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            SYSTEM_BASE=system
            VERSION=${{ env.VERSION }}
            WHEEL_SHA256=${{ env.WHEEL_SHA256 }}
            REVISION=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/spellwarden-ai/spellwarden
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Build provenance of the wheel inside it
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/spellwarden-${{ env.VERSION }}-py3-none-any.whl
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # shellcheck disable=SC2016  # the backticks are Markdown, not a command substitution
          printf '### Image\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [build, publish, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: dist holds exactly the two files the build job hashed
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "spellwarden-${VERSION}-py3-none-any.whl spellwarden-${VERSION}.tar.gz "
          printf '%s  %s\n' "$WHEEL_SHA256" "dist/spellwarden-${VERSION}-py3-none-any.whl" \
            "$SDIST_SHA256" "dist/spellwarden-${VERSION}.tar.gz" | sha256sum -c -
      - name: The GitHub release with the draft manifest (commits filled later by manifest.yml)
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          python3 scripts/release_manifest.py draft --version "$VERSION" --wheel-sha256 "$WHEEL_SHA256" \
            --sdist-sha256 "$SDIST_SHA256" --image-digest "$DIGEST" > release-manifest.json
          gh release create "v${VERSION}" --verify-tag --title "spellwarden ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/spellwarden-${VERSION}-py3-none-any.whl" "dist/spellwarden-${VERSION}.tar.gz" release-manifest.json
