name: check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    # Spec 7.2: the image builds with no network after the wheelhouse step, and runs as uid 10001 on a root-owned
    # workspace. The `system` stage (Debian's git) is built first with the network and tagged spellwarden-system; the
    # offline build starts FROM that image, because --network none is part of every RUN's cache key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.13"
      - run: uv build
      - name: Hash-checked PyYAML wheelhouse (the last network step)
        env:
          # setup-uv's python-version activates a uv virtual environment, which has no pip: pip is setup-python's.
          SETUP_PYTHON: ${{ steps.py.outputs.python-path }}
        run: >-
          "$SETUP_PYTHON" -m pip download --only-binary :all: --require-hashes --no-deps
          --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64
          --python-version 3.13 --implementation cp --abi cp313
          -r docker/requirements.deps.txt -d wheelhouse
      - name: System layer
        run: docker build --target system -f docker/Dockerfile -t spellwarden-system .
      - name: Offline build
        run: |
          set -euo pipefail
          version="$(uv run --locked python -c 'import spellwarden_scan; print(spellwarden_scan.__version__)')"
          wheel="dist/spellwarden-${version}-py3-none-any.whl"
          docker build --network none -f docker/Dockerfile \
            --build-arg VERSION="$version" \
            --build-arg WHEEL_SHA256="$(sha256sum "$wheel" | cut -d' ' -f1)" \
            -t spellwarden:check .
      - name: Container test
        run: bash docker/container-test.sh spellwarden:check
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv python pin ${{ matrix.python }}
      - run: make check

  # The Action promises macOS and Windows runners, and the containment rules of spec 6.13 differ per platform
  # (spec 7.1). The Makefile's `check` target is spelled out: GNU make is not on every Windows image.
  check-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed (fixtures are hashed byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.13"
      - run: uv python pin 3.13
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      # A test that runs past 120 s prints every thread's stack, so a hang shows where it waits.
      - run: uv run --locked pytest -q -o faulthandler_timeout=120
      - run: uv build

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
      # From actionlint_1.7.7_checksums.txt of the release, the line of actionlint_1.7.7_linux_amd64.tar.gz.
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install actionlint (pinned version, checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
      - run: ./actionlint -color
