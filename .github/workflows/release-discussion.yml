name: release-discussion

# The thread of one release in GitHub Discussions (community reports spec 9.2). scripts/release_discussion.py builds the title and the
# body from CHANGELOG.md; this job posts them once. Three events feed the one job:
#   - release: published, for a release that a person makes;
#   - workflow_run of `release`, for the release that the release workflow makes itself (GitHub does not start a workflow from an event
#     that another workflow's GITHUB_TOKEN caused, so `release: published` alone never fires for it);
#   - workflow_dispatch with a version: the repair path when a run failed, and the live check.
# A thread that exists is left alone, so running it again does nothing. The release job and its token stay as they are.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: The released version, X.Y.Z
        required: true
        type: string

permissions:
  contents: read
  discussions: write

# One fixed group, never cancelled: two events for one release run one after the other, and the second finds the thread.
concurrency:
  group: release-discussion
  cancel-in-progress: false

jobs:
  thread:
    # A run of the release workflow that did not succeed makes no thread.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      INPUT_VERSION: ${{ inputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) tag="$RELEASE_TAG" ;;
            workflow_run) tag="$RUN_BRANCH" ;;
            workflow_dispatch) tag="v$INPUT_VERSION" ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            if [ "$EVENT" = workflow_run ]; then
              echo "The release workflow ran for a ref that is not a release tag: no thread."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::the version must be X.Y.Z, and the tag vX.Y.Z"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      # The script and the CHANGELOG come from the default branch, which holds every released section, also those of releases
      # whose tag predates this workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.version.outputs.skip == 'false'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Build the title and the body
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_discussion.py title "$VERSION" > "$RUNNER_TEMP/title.txt"
          python3 scripts/release_discussion.py body "$VERSION" > "$RUNNER_TEMP/body.md"
      - name: Post the thread unless it exists
        if: steps.version.outputs.skip == 'false'
        run: |
          # shellcheck disable=SC2016  # $owner, $name, $q, $repo, $category, $title and $body are GraphQL variables
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY##*/}"
          title="$(cat "$RUNNER_TEMP/title.txt")"
          details="$(gh api graphql -f owner="$owner" -f name="$name" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                id
                hasDiscussionsEnabled
                discussionCategories(first: 25) { nodes { id name } }
              }
            }')"
          if [ "$(jq -r '.data.repository.hasDiscussionsEnabled' <<<"$details")" != true ]; then
            echo "::error::Discussions is not turned on for $REPOSITORY"
            exit 1
          fi
          category="$(jq -r '.data.repository.discussionCategories.nodes[] | select(.name == "Announcements") | .id' <<<"$details")"
          if [ -z "$category" ]; then
            echo "::error::the discussion category Announcements does not exist in $REPOSITORY"
            exit 1
          fi
          found="$(gh api graphql -f q="repo:$REPOSITORY in:title $title" -f query='
            query($q: String!) {
              search(type: DISCUSSION, query: $q, first: 20) { nodes { ... on Discussion { title url } } }
            }' | jq -r --arg title "$title" '[.data.search.nodes[] | select(.title == $title) | .url][0] // empty')"
          if [ -n "$found" ]; then
            echo "the thread exists: $found"
            exit 0
          fi
          gh api graphql -f repo="$(jq -r '.data.repository.id' <<<"$details")" -f category="$category" -f title="$title" \
            -F body=@"$RUNNER_TEMP/body.md" -f query='
            mutation($repo: ID!, $category: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repo, categoryId: $category, title: $title, body: $body}) {
                discussion { url }
              }
            }' --jq '.data.createDiscussion.discussion.url'
